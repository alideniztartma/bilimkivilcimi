<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#BilimKıvılcımı</title>
<meta name="description" content="Hatay'daki çocuklar için ücretsiz, oyun gibi kodlama dersleri ve bilim deneyi oyunları. Bir Antioch Rising #10947 projesi.">
<meta name="theme-color" content="#2F3A28">
<meta property="og:title" content="#BilimKıvılcımı · Yazılımın Duolingosu">
<meta property="og:description" content="Anka ile oyun gibi kodlama öğren, laboratuvarda deney oyunları oyna. Ücretsiz ve Türkçe.">

<link rel="stylesheet" href="css/ekler.css">

<link rel="stylesheet" href="css/anim.css">
<style>
#boot{position:fixed;inset:0;z-index:9999;background:#D9822B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .2s ease}
#boot.out{opacity:0;pointer-events:none}
#boot .bt-disk{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px}
#boot .bt-anka{display:block;width:240px;height:240px;clip-path:circle(33.4% at 50% 50%);animation:btHop .7s .15s cubic-bezier(.3,1.6,.5,1) both}
#boot .bt-name{position:absolute;left:0;right:0;text-align:center;top:calc(50% + 106px);font:700 clamp(28px,8.5vw,40px)/1 'Zilla Slab',Georgia,serif;color:#FBF3E2;letter-spacing:.2px;animation:btUp .5s .12s ease both}
#boot .bt-name b{color:#7A2E16}
#boot .bt-team{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font:700 12px/1 Manrope,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2E16;opacity:.75}
@keyframes btHop{0%{transform:translateY(18px) scale(.9)}100%{transform:none}}
@keyframes btUp{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){#boot *{animation:none!important}}
</style>
</head>
<body>
<div id="boot" role="presentation"><div class="bt-disk"><img class="bt-anka" src="img/anka-bas.png" width="240" height="240" alt=""></div><div class="bt-name"><b>#</b>BilimKıvılcımı</div><div class="bt-team" lang="en">Antioch Rising #10947</div></div>
<script>(function(){var b=document.getElementById('boot');if(!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())){b.remove();return}document.documentElement.style.background='#D9822B';window.__bootT=Date.now()})()</script>

<div class="app">
  <aside class="side" aria-label="Menü">
    <a class="brand" href="#ogren"><img src="img/logo.png" alt="Antioch Rising logosu"><span><b>#</b>BilimKıvılcımı</span></a>
    <nav id="sideNav"></nav>
    <div class="small">
      <a href="#yuva">Anka'nın yuvası</a>
      <a href="#defter">Deney defterim</a>

      <a href="#hakkinda">Proje hakkında</a>
      <a href="#yonetici">Yönetici paneli</a>
    </div>
  </aside>

  <main class="center" id="main">
    <header class="mtop">
      <div class="stats"><a class="brand" href="#ogren"><img src="img/logo.png" alt="Antioch Rising logosu"><span><b>#</b>BilimKıvılcımı</span></a><span class="stats-slot"></span></div>
    </header>
    <section data-page="ogren"><div id="path"></div></section>
    <section data-page="atolye" hidden><div class="page" id="pgHub"></div></section>
    <section data-page="cizim" hidden><div class="page" id="pgDraw" style="max-width:920px"></div></section>
    <section data-page="sozluk" hidden><div class="page" id="pgGloss"></div></section>
    <section data-page="gorevler" hidden><div class="page" id="pgQuests"></div></section>
    <section data-page="magaza" hidden><div class="page" id="pgShop"></div></section>
    <section data-page="profil" hidden><div class="page" id="pgProfile"></div></section>
    <section data-page="lab" hidden><div class="page wide" id="pgLab"></div></section>
    <section data-page="exp" hidden><div class="page wide" id="pgExp"></div></section>
    <section data-page="defter" hidden><div class="page wide" id="pgNote" style="max-width:960px"></div></section>
    <section data-page="ogretmen" hidden><div class="page wide" id="pgTeach"></div></section>
    <section data-page="yonetici" hidden><div class="page wide" id="pgAdmin"></div></section>
    <section data-page="yuva" hidden><div class="page" id="pgNest"></div></section>
    <section data-page="hakkinda" hidden><div class="page wide" id="pgAbout" style="max-width:1000px"></div></section>
  </main>

  <aside class="right" aria-label="Durumum">
    <div class="stats stats-slot"></div>
    <div class="card rc" id="rcStreak"></div>
    <div class="card rc" id="rcGoalQuests"></div>
    <div class="card rc" id="rcDaily"></div>
    <p style="font-size:.85rem;color:var(--muted);padding:0 6px">#BilimKıvılcımı bir <b>Antioch Rising #10947</b> projesidir.</p>
  </aside>

</div>

<nav class="mtab" id="tabNav" aria-label="Sekmeler"></nav>

</div>
