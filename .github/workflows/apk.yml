# Bu dosyayı GitHub'da .github/workflows/apk.yml konumuna taşıyın.
# Sonra her main gönderiminde APK kendiliğinden derlenir ve
# "Releases" altındaki "apk-latest" sürümüne konur.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK yolunu ayarla
        run: echo "sdk.dir=$ANDROID_HOME" && test -d "$ANDROID_HOME"

      - name: Web dosyalarını uygulamaya kopyala
        run: |
          mkdir -p app/www app/assets
          cp -r index.html css js img fonts app/www/
          cp assets/*.png app/assets/

      - name: Capacitor ile Android projesi oluştur
        working-directory: app
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/haptics@7 @capacitor/status-bar@7 @capacitor/splash-screen@7 @capacitor/assets@3
          npx cap init "Anka #BilimKıvılcımı" org.antiochrising.bilimkivilcimi --web-dir www
          node -e "const f='capacitor.config.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.android=Object.assign({},c.android,{adjustMarginsForEdgeToEdge:'force'});c.backgroundColor='#D9822B';c.plugins=Object.assign({},c.plugins,{StatusBar:{overlaysWebView:false,style:'DARK',backgroundColor:'#D9822B'},SplashScreen:{launchAutoHide:false,launchShowDuration:0,launchFadeOutDuration:150,backgroundColor:'#D9822B',showSpinner:false}});fs.writeFileSync(f,JSON.stringify(c,null,2));console.log(c)"
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#D9822B' --splashBackgroundColor '#D9822B' --splashBackgroundColorDark '#D9822B'
          cp ../android/MainActivity.java android/app/src/main/java/org/antiochrising/bilimkivilcimi/MainActivity.java
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp ../android/splash_icon.png android/app/src/main/res/drawable-nodpi/splash_icon.png
          node -e "const fs=require('fs');for(const f of ['android/app/src/main/res/values/styles.xml','android/app/src/main/res/values-v31/styles.xml']){if(!fs.existsSync(f))continue;let s=fs.readFileSync(f,'utf8');s=s.replace(/(<style name=\"AppTheme.NoActionBarLaunch\"[^>]*>)/,'\$1<item name=\"windowSplashScreenBackground\">#D9822B</item><item name=\"windowSplashScreenAnimatedIcon\">@drawable/splash_icon</item><item name=\"android:windowBackground\">#D9822B</item>');fs.writeFileSync(f,s);console.log(f,s)}"
          npx cap sync android

      - name: APK derle
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını adlandır
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk BilimKivilcimi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BilimKivilcimi-apk
          path: BilimKivilcimi.apk

      - name: İndirme sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: BilimKıvılcımı Android uygulaması
          body: En son sürüm. BilimKivilcimi.apk dosyasını telefona indirip açın. Telefon izin isterse "Bilinmeyen kaynaklardan yüklemeye izin ver" seçeneğini açın.
          files: BilimKivilcimi.apk
          make_latest: true
